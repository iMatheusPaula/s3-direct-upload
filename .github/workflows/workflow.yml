name: 🚀 push to main

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ECR_REPOSITORY: s3-direct-upload
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: login to AWS ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: set image tag
        id: image
        run: |
          IMAGE_TAG=$(date -u +'%Y%m%d-%H%M%S')
          REPO=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          echo "repo=${REPO}" >> $GITHUB_OUTPUT
          echo "full=${REPO}:${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "latest=${REPO}:latest" >> $GITHUB_OUTPUT

      - name: build docker image
        run: |
          docker build \
            --target prod \
            -t ${{ steps.image.outputs.full }} \
            -t ${{ steps.image.outputs.latest }} \
            api

      - name: push image to AWS ECR
        run: docker push --all-tags ${{ steps.image.outputs.repo }}
